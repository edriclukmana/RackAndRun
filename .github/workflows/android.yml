name: Android APK

# Builds the app on every push to main. Download the APK from the run's "Artifacts".
# Push a tag like v1.0.0 and the APK is also attached to a GitHub Release.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Install
        run: npm ci

      - name: Test the game rules and the online adapter
        run: npm test

      - name: Create the Android project
        run: npx cap add android

      - name: Generate the app icon and splash screens
        run: npm run android:assets

      - name: Copy the game into the Android project
        run: npx cap sync android

      - name: Use the project's signing key, so new versions install over old ones
        run: |
          mkdir -p ~/.android
          cp keystore/debug.keystore ~/.android/debug.keystore

      - name: Build the APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Name the APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk rack-and-run.apk

      - uses: actions/upload-artifact@v7
        with:
          name: rack-and-run-apk
          path: rack-and-run.apk

      - name: Attach the APK to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: rack-and-run.apk
