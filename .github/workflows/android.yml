name: Android APK

# Builds the app on every push to main. Download the APK from the run's "Artifacts".
# Push a tag like v1.0.0 and the APK is also attached to a GitHub Release.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Install
        run: npm ci

      - name: Test the game rules and the online adapter
        run: npm test

      - name: Create the Android project (signed with the project key, with a new version number)
        run: npm run android:add

      - name: Generate the app icon and splash screens
        run: npm run android:assets

      - name: Copy the game into the Android project
        run: npx cap sync android

      - name: Build the APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Name the APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk rack-and-run.apk

      # Android only installs an update if it is signed with the same key as the app
      # already on the phone. Stop here if this APK was signed with anything else.
      - name: Check the APK is signed with the project key
        run: |
          EXPECTED=$(keytool -list -v -keystore keystore/debug.keystore -storepass android -alias androiddebugkey \
            | grep -m1 'SHA256:' | sed 's/.*SHA256: *//; s/://g' | tr 'A-F' 'a-f')
          APKSIGNER="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner"
          ACTUAL=$("$APKSIGNER" verify --print-certs rack-and-run.apk | grep -m1 'SHA-256 digest' | sed 's/.*digest: *//')
          echo "Project key: $EXPECTED"
          echo "APK key:     $ACTUAL"
          if [ -z "$EXPECTED" ] || [ "$EXPECTED" != "$ACTUAL" ]; then
            echo "::error::The APK is not signed with keystore/debug.keystore, so it would not install over the existing app."
            exit 1
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: rack-and-run-apk
          path: rack-and-run.apk

      - name: Attach the APK to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: rack-and-run.apk
